name: hydramp-amp-classifier
version: 1.2.0
type: classifier
framework: lstm
description: >
  HydrAMP AMP classifier: two-layer LSTM without convolution (NoConvAMPClassifier),
  trained as part of the HydrAMP generative model. Sequences up to 25 amino acids.
paper: "https://doi.org/10.1038/s42256-023-00619-3"
source_repo: "https://github.com/szczurek-lab/hydramp"
length_min: 1
length_max: 25
gpu_required: false
